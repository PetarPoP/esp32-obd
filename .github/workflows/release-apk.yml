name: Release APK

# Builds the Android app and attaches the APK to a GitHub Release.
#   git tag app-v2.1.0 && git push origin app-v2.1.0   -> release "App 2.1.0"
# Run it by hand (Actions -> Release APK -> Run workflow) for a test build;
# that only uploads the APK as a workflow artifact.
#
# Optional secrets for signing with your own key (otherwise the debug key is
# used, which is fine for sideloading but cannot go to the Play Store):
#   ANDROID_KEYSTORE_BASE64  base64 of the .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck
      - name: Version
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/app-v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "::error::tag app-v$TAG_VERSION does not match app.json version $VERSION"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the debug key"
          fi
      - run: npx expo prebuild --platform android --no-install --clean
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Collect APK
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk "../dist/obd-ble-monitor-${{ steps.version.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: obd-ble-monitor-${{ steps.version.outputs.version }}
          path: dist/*.apk
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          name: App ${{ steps.version.outputs.version }}
          files: dist/*.apk
          generate_release_notes: true
